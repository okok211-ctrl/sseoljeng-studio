<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>썰쟁 Studio v4</title>
<meta name="description" content="썰쟁 전용 무료 유튜브 사연 제작 스튜디오">
<style>
:root{
  --bg:#050b14;--panel:#0d1828;--panel2:#111f33;--line:#273b57;
  --text:#f8fafc;--muted:#9fb0c5;--accent:#ff7a18;--accent2:#ff9a4b;
  --ok:#25c878;--danger:#ff6670;--gold:#ffd166;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;color:var(--text);
  font-family:system-ui,-apple-system,"Noto Sans KR","Segoe UI",sans-serif;
  background:
    radial-gradient(circle at 95% 0,rgba(255,122,24,.20),transparent 28%),
    linear-gradient(145deg,#02070e,#071322 52%,#0d1728);
}
button,input,textarea,select{font:inherit}
.app{max-width:1580px;margin:auto;padding:18px}
.top{
  display:flex;justify-content:space-between;align-items:center;gap:16px;
  padding:18px 20px;border-radius:20px;background:rgba(13,24,40,.92);
  border:1px solid rgba(255,255,255,.08);box-shadow:0 18px 50px rgba(0,0,0,.28);
}
.brand h1{margin:0;font-size:clamp(25px,4vw,40px);letter-spacing:-.05em}
.brand p{margin:5px 0 0;color:var(--muted);font-size:13px}
.topActions{display:flex;gap:8px;flex-wrap:wrap}
.badge{
  display:inline-flex;align-items:center;padding:8px 11px;border-radius:999px;
  background:rgba(37,200,120,.12);border:1px solid rgba(37,200,120,.35);
  color:#baffd8;font-weight:900;font-size:11px
}
.layout{display:grid;grid-template-columns:360px 1fr;gap:16px;margin-top:16px}
.panel{
  background:rgba(13,24,40,.95);border:1px solid rgba(255,255,255,.08);
  border-radius:19px;box-shadow:0 16px 45px rgba(0,0,0,.23)
}
.side{padding:17px;height:max-content;position:sticky;top:15px}
.main{padding:17px;min-width:0}
h2{font-size:17px;margin:0 0 13px}
.field{margin:11px 0}
.field label{display:block;font-size:12px;font-weight:900;color:#cdd8e6;margin-bottom:6px}
.field input,.field textarea,.field select{
  width:100%;border:1px solid var(--line);border-radius:10px;background:#06101d;
  color:#fff;padding:10px 11px;outline:none
}
.field textarea{min-height:80px;resize:vertical;line-height:1.55}
.field input:focus,.field textarea:focus,.field select:focus{
  border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,122,24,.12)
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checks{display:grid;gap:8px;margin:11px 0}
.check{display:flex;gap:8px;align-items:flex-start;color:#c6d2df;font-size:12px;line-height:1.45}
.btn{
  border:0;border-radius:11px;padding:10px 12px;font-weight:900;cursor:pointer;
  transition:.16s transform
}
.btn:hover{transform:translateY(-1px)}
.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.secondary{background:#243751;color:#eef5ff}
.ghost{background:#0b1524;color:#dbe7f5;border:1px solid var(--line)}
.success{background:var(--ok);color:#052316}
.danger{background:#3b1920;color:#ffc6ca;border:1px solid #65313a}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.wide{grid-column:1/-1}
.status{
  margin-top:11px;padding:10px;border:1px dashed var(--line);border-radius:10px;
  background:#07111f;color:var(--muted);font-size:12px;line-height:1.5
}
.status.ok{color:#baffd5;border-color:#2d7851}
.status.bad{color:#ffc2c7;border-color:#7e3640}
.note{
  margin-top:12px;padding:11px;border-radius:11px;background:rgba(255,122,24,.08);
  border:1px solid rgba(255,122,24,.25);color:#ffd8bb;font-size:12px;line-height:1.55
}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:5px;margin-bottom:12px}
.tab{
  white-space:nowrap;border:1px solid var(--line);background:#18283e;color:#b8c7da;
  border-radius:999px;padding:8px 12px;font-size:12px;font-weight:900;cursor:pointer
}
.tab.active{background:rgba(255,122,24,.17);color:#ffd7b8;border-color:rgba(255,122,24,.55)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.meta{color:var(--muted);font-size:12px}
.output{
  width:100%;min-height:610px;background:#040b14;border:1px solid #20344f;
  border-radius:14px;padding:17px;color:#fff;white-space:pre-wrap;line-height:1.75;
  overflow:auto;font-size:14px;resize:vertical
}
.hidden{display:none!important}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{background:#07111f;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.preview{aspect-ratio:16/9;background:linear-gradient(135deg,#15253b,#08111d);display:grid;place-items:center;color:#8496ad}
.preview.vertical{aspect-ratio:9/16;max-height:580px}
.preview img{width:100%;height:100%;object-fit:cover}
.cardBody{padding:12px}
.cardBody h3{font-size:13px;margin:0 0 7px}
.prompt{font-size:11px;color:#aebed2;line-height:1.55;white-space:pre-wrap;max-height:160px;overflow:auto}
.mini{display:flex;gap:7px;margin-top:9px}
.mini button{flex:1;padding:8px;font-size:11px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.76);display:grid;place-items:center;padding:18px;z-index:50}
.modalBox{width:min(820px,100%);max-height:88vh;overflow:auto;background:#0e1929;border:1px solid #344c6b;border-radius:18px;padding:18px}
.code{background:#050b14;border:1px solid #263b57;border-radius:9px;padding:10px;white-space:pre-wrap;color:#ffd0ad;font-size:12px;line-height:1.65}
.projectItem{display:flex;justify-content:space-between;gap:8px;align-items:center;background:#07111f;border:1px solid var(--line);border-radius:11px;padding:10px;margin:8px 0}
.small{font-size:11px;color:var(--muted)}
@media(max-width:920px){
  .layout{grid-template-columns:1fr}.side{position:static}.grid{grid-template-columns:1fr}
  .top{align-items:flex-start;flex-direction:column}.output{min-height:450px}
}
</style>
</head>
<body>
<div class="app">
<header class="top">
  <div class="brand">
    <h1>🎬 썰쟁 Studio v4</h1>
    <p>태현 전용 · API 비용 0원 · ChatGPT와 캡컷 사이 작업을 한 번에 정리</p>
  </div>
  <div class="topActions">
    <span class="badge">무료 모드</span>
    <button class="btn ghost" onclick="openProjects()">프로젝트</button>
    <button class="btn primary" onclick="saveProject()">저장</button>
  </div>
</header>

<main class="layout">
<aside class="panel side">
  <h2>이야기 설정</h2>

  <div class="field"><label>프로젝트 이름</label><input id="projectName" value="새로운 사연"></div>
  <div class="field"><label>주제</label><textarea id="topic">남편의 장례식장에 죽은 줄 알았던 여자가 나타났습니다.</textarea></div>
  <div class="field"><label>여자 주인공</label><textarea id="heroine">42세 한국인 여성, 자연스러운 롱펌, 차분하고 강단 있는 인상, 동일 인물 유지</textarea></div>

  <div class="row">
    <div class="field"><label>문단 수</label><select id="paragraphs"><option>15</option><option selected>20</option></select></div>
    <div class="field"><label>본문 이미지</label><select id="imageCount"><option>3</option><option selected>4</option><option>5</option></select></div>
  </div>

  <div class="row">
    <div class="field"><label>시점</label><select id="pov"><option>3인칭 관찰자</option><option>1인칭 회고체</option></select></div>
    <div class="field"><label>분위기</label><select id="tone"><option>긴장감</option><option>통쾌한 반전</option><option>감동</option><option>가족 갈등</option></select></div>
  </div>

  <div class="checks">
    <label class="check"><input id="subscribe" type="checkbox" checked>0문단에 구독·좋아요·알림 멘트</label>
    <label class="check"><input id="noBubbles" type="checkbox" checked>이미지 말풍선·문자·워터마크 금지</label>
    <label class="check"><input id="longPerm" type="checkbox" checked>여주 얼굴·롱펌·의상 일관성 강조</label>
  </div>

  <div class="actions">
    <button class="btn primary wide" onclick="makeMasterPrompt()">💬 전체 요청문 만들기</button>
    <button class="btn secondary wide" onclick="pasteStory()">📋 대본 붙여넣기</button>
    <button class="btn secondary" onclick="makeScenes()">본문 이미지</button>
    <button class="btn secondary" onclick="makeThumbnail()">썸네일</button>
    <button class="btn secondary" onclick="makeShorts()">쇼츠 4컷</button>
    <button class="btn secondary" onclick="makeYoutube()">유튜브 정보</button>
    <button class="btn secondary" onclick="makeJapanesePrompt()">일본어판</button>
    <button class="btn secondary" onclick="makeCaptions()">SRT 자막</button>
    <button class="btn success wide" onclick="downloadZip()">📦 캡컷용 ZIP 저장</button>
  </div>

  <div id="status" class="status">전체 요청문을 만든 뒤 ChatGPT에 붙여넣어 대본을 생성하세요.</div>
  <div class="note">AI 생성은 지금 사용 중인 ChatGPT에서 하고, 이 사이트는 대본·이미지·쇼츠·자막·업로드 자료를 정리합니다. 별도 API 비용은 없습니다.</div>
</aside>

<section class="panel main">
  <nav class="tabs">
    <button class="tab active" data-tab="story">롱폼</button>
    <button class="tab" data-tab="images">본문 이미지</button>
    <button class="tab" data-tab="thumbnail">썸네일</button>
    <button class="tab" data-tab="shorts">쇼츠</button>
    <button class="tab" data-tab="youtube">유튜브</button>
    <button class="tab" data-tab="japanese">일본어</button>
    <button class="tab" data-tab="captions">자막</button>
  </nav>

  <div class="toolbar">
    <span id="meta" class="meta">글자 수 0자</span>
    <button class="btn ghost" onclick="copyCurrent()">현재 내용 복사</button>
  </div>

  <div id="storyPane"><textarea id="storyOutput" class="output" placeholder="ChatGPT에서 만든 롱폼 대본을 여기에 붙여넣으세요."></textarea></div>
  <div id="imagesPane" class="hidden"><div id="imageGrid" class="grid"></div></div>
  <div id="thumbnailPane" class="hidden"><div id="thumbnailGrid" class="grid"></div></div>
  <div id="shortsPane" class="hidden"><textarea id="shortsOutput" class="output"></textarea></div>
  <div id="youtubePane" class="hidden"><textarea id="youtubeOutput" class="output"></textarea></div>
  <div id="japanesePane" class="hidden"><textarea id="japaneseOutput" class="output"></textarea></div>
  <div id="captionsPane" class="hidden"><textarea id="captionsOutput" class="output"></textarea></div>
</section>
</main>
</div>

<div id="promptModal" class="modal hidden" onclick="if(event.target===this)closeModal('promptModal')">
  <div class="modalBox">
    <h2>ChatGPT 전체 요청문</h2>
    <div id="promptText" class="code"></div><br>
    <button class="btn primary" onclick="copyPrompt()">요청문 복사</button>
    <button class="btn ghost" onclick="closeModal('promptModal')">닫기</button>
  </div>
</div>

<div id="pasteModal" class="modal hidden" onclick="if(event.target===this)closeModal('pasteModal')">
  <div class="modalBox">
    <h2>대본 붙여넣기</h2>
    <textarea id="pasteBox" class="output" style="min-height:430px" placeholder="ChatGPT에서 받은 전체 대본을 붙여넣으세요."></textarea><br>
    <button class="btn primary" onclick="applyPaste()">적용</button>
    <button class="btn ghost" onclick="closeModal('pasteModal')">닫기</button>
  </div>
</div>

<div id="projectsModal" class="modal hidden" onclick="if(event.target===this)closeModal('projectsModal')">
  <div class="modalBox">
    <h2>저장된 프로젝트</h2>
    <div id="projectList"></div><br>
    <button class="btn ghost" onclick="closeModal('projectsModal')">닫기</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const state={id:null,active:'story',scenes:[],thumbnails:[]};
const tabs=['story','images','thumbnail','shorts','youtube','japanese','captions'];

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));

function switchTab(t){
  state.active=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
  tabs.forEach(x=>$(x+'Pane').classList.toggle('hidden',x!==t));
  updateMeta();
}
function settings(){
  return{
    projectName:$('projectName').value.trim(),
    topic:$('topic').value.trim(),
    heroine:$('heroine').value.trim(),
    paragraphs:+$('paragraphs').value,
    imageCount:+$('imageCount').value,
    pov:$('pov').value,
    tone:$('tone').value,
    subscribe:$('subscribe').checked,
    noBubbles:$('noBubbles').checked,
    longPerm:$('longPerm').checked
  }
}
function status(t,type=''){
  $('status').textContent=t;
  $('status').className='status '+type;
}
function closeModal(id){$(id).classList.add('hidden')}
function updateMeta(){
  let t='';
  if(state.active==='images')t=state.scenes.map(x=>x.prompt).join('');
  else if(state.active==='thumbnail')t=state.thumbnails.map(x=>x.prompt).join('');
  else t=$(state.active+'Output')?.value||'';
  $('meta').textContent=`글자 수 ${t.length.toLocaleString()}자 · ${state.active}`;
}
['storyOutput','shortsOutput','youtubeOutput','japaneseOutput','captionsOutput'].forEach(id=>$(id).addEventListener('input',updateMeta));

function makeMasterPrompt(){
  const v=settings();
  const text=`다음 설정으로 유튜브 사연 채널 '썰쟁'용 롱폼 원고를 작성해줘.

주제: ${v.topic}
주인공: ${v.heroine}
시점: ${v.pov}
분위기: ${v.tone}
분량: 0문단 오프닝 + 본문 ${v.paragraphs}문단
문단당 분량: 약 420~450자

고정 규칙:
- 사건을 먼저 보여주는 강한 후킹
- 대화체는 최소화
- '~다/~습니다' 종결은 전체의 약 10% 이하
- 나머지는 '~했어요, ~였지요, ~더군요' 등을 자연스럽게 혼합
- 중장년층이 듣기 편한 문장
- 과도한 폭력과 선정성은 피하기
- 동일 이야기 안에서 인물 설정과 사건 흐름 일관성 유지
- 0문단에 "시청 전 구독과 좋아요, 알림은 큰 힘이 됩니다." 포함
- 각 문단 끝에 [문단 글자 수: N자] 표시
- 완성 원고만 출력`;
  $('promptText').textContent=text;
  $('promptModal').classList.remove('hidden');
}
async function copyPrompt(){
  await navigator.clipboard.writeText($('promptText').textContent);
  status('전체 요청문을 복사했습니다. ChatGPT에 붙여넣으세요.','ok');
}
function pasteStory(){
  $('pasteBox').value=$('storyOutput').value;
  $('pasteModal').classList.remove('hidden');
}
function applyPaste(){
  $('storyOutput').value=$('pasteBox').value.trim();
  closeModal('pasteModal');switchTab('story');updateMeta();
  status('대본을 적용했습니다. 이제 본문 이미지·썸네일·쇼츠·자막을 만들 수 있습니다.','ok');
}
function paragraphs(){
  const raw=$('storyOutput').value.trim();
  if(!raw)return[];
  const matches=[...raw.matchAll(/(?:^|\n)(\d+문단)\s*\n([\s\S]*?)(?=\n\d+문단|\n*$)/g)];
  if(matches.length)return matches.map(m=>(m[1]+'\n'+m[2]).trim());
  return raw.split(/\n{2,}/).map(x=>x.trim()).filter(x=>x&&!/^\[문단 글자 수/.test(x));
}
function cleanText(t){
  return t.replace(/\[문단 글자 수:[^\]]+\]/g,'').replace(/^\d+문단\s*/,'').trim();
}
function makeScenes(){
  const v=settings(),ps=paragraphs();
  if(!ps.length){status('먼저 대본을 붙여넣으세요.','bad');return}
  const n=v.imageCount, stages=['사건의 시작','갈등의 확대','숨겨진 단서','결정적 반전','새로운 출발'];
  state.scenes=[];
  for(let i=0;i<n;i++){
    const start=Math.floor(i*ps.length/n),end=Math.max(start+1,Math.floor((i+1)*ps.length/n));
    const excerpt=ps.slice(start,end).map(cleanText).join(' ').slice(0,700);
    state.scenes.push({
      title:`본문 이미지 ${i+1} · ${stages[i]||'핵심 장면'}`,
      prompt:`한국 드라마 실사 영화 스틸, 16:9.
주제: ${v.topic}
동일 여자 주인공: ${v.heroine}
장면 내용: ${excerpt}
감정이 선명한 표정, 자연스러운 한국 가정 또는 사건 장소, 시네마틱 조명, 현실적인 의상.
같은 이야기의 모든 이미지에서 동일 얼굴, 동일 헤어스타일, 동일 연령대 유지.
화면 안 글자, 자막, 말풍선, 대화창, 로고, 워터마크 없음.`
    });
  }
  renderScenes();switchTab('images');
  status('본문 이미지 프롬프트를 만들었습니다. 복사해서 ChatGPT 이미지 생성에 사용하세요.','ok');
}
function renderScenes(){
  const g=$('imageGrid');g.innerHTML='';
  state.scenes.forEach((s,i)=>{
    const c=document.createElement('article');c.className='card';
    c.innerHTML=`<div id="scenePrev${i}" class="preview"><span>본문 이미지 ${i+1}</span></div>
      <div class="cardBody"><h3>${esc(s.title)}</h3><div class="prompt">${esc(s.prompt)}</div>
      <div class="mini"><button class="btn primary" onclick="copyScene(${i})">프롬프트 복사</button>
      <button class="btn ghost" onclick="$('sceneFile${i}').click()">이미지 넣기</button></div>
      <input id="sceneFile${i}" class="hidden" type="file" accept="image/*" onchange="readSceneImage(event,${i})"></div>`;
    g.appendChild(c);
  });
  updateMeta();
}
async function copyScene(i){
  await navigator.clipboard.writeText(state.scenes[i].prompt);
  status(`본문 이미지 ${i+1} 프롬프트를 복사했습니다.`,'ok');
}
function readSceneImage(e,i){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{
    state.scenes[i].image=r.result;
    $('scenePrev'+i).innerHTML=`<img src="${r.result}" alt="본문 이미지 ${i+1}">`;
    status(`본문 이미지 ${i+1}을 추가했습니다.`,'ok');
  };r.readAsDataURL(f);
}

function makeThumbnail(){
  const v=settings(),story=$('storyOutput').value.trim();
  if(!story){status('먼저 대본을 붙여넣으세요.','bad');return}
  const hooks=[
    '장례식장에 살아 있는 여자가 나타났습니다',
    '죽은 줄 알았던 여자가 모든 진실을 밝혔습니다',
    '남편의 장례식에서 믿을 수 없는 일이 벌어졌습니다'
  ];
  state.thumbnails=hooks.map((hook,i)=>({
    title:`썸네일 ${String.fromCharCode(65+i)}안`,
    copy:hook,
    prompt:`유튜브 사연 영상 썸네일, 16:9.
주제: ${v.topic}
동일 여자 주인공: ${v.heroine}
강렬한 감정 대립, 한국 드라마 실사 스타일, 큰 인물 얼굴 중심, 높은 대비, 클릭을 부르는 긴장감.
썸네일 문구: "${hook}"
글자는 크고 읽기 쉽게, 인물 얼굴을 가리지 않게 배치.

  }));
  renderThumbnails();switchTab('thumbnail');
  status('썸네일 3안을 만들었습니다. 문구와 프롬프트를 각각 복사할 수 있습니다.','ok');
}
function renderThumbnails(){
  const g=$('thumbnailGrid');g.innerHTML='';
  state.thumbnails.forEach((s,i)=>{
    const c=document.createElement('article');c.className='card';
    c.innerHTML=`<div id="thumbPrev${i}" class="preview"><span>${esc(s.copy)}</span></div>
      <div class="cardBody"><h3>${esc(s.title)} · ${esc(s.copy)}</h3><div class="prompt">${esc(s.prompt)}</div>
      <div class="mini"><button class="btn primary" onclick="copyThumbnail(${i})">프롬프트 복사</button>
      <button class="btn ghost" onclick="$('thumbFile${i}').click()">이미지 넣기</button></div>
      <input id="thumbFile${i}" class="hidden" type="file" accept="image/*" onchange="readThumbImage(event,${i})"></div>`;
    g.appendChild(c);
  });
  updateMeta();
}
async function copyThumbnail(i){
  await navigator.clipboard.writeText(state.thumbnails[i].prompt);
  status(`${state.thumbnails[i].title} 프롬프트를 복사했습니다.`,'ok');
}
function readThumbImage(e,i){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{
    state.thumbnails[i].image=r.result;
    $('thumbPrev'+i).innerHTML=`<img src="${r.result}" alt="썸네일">`;
    status(`${state.thumbnails[i].title} 이미지를 추가했습니다.`,'ok');
  };r.readAsDataURL(f);
}

function makeShorts(){
  const ps=paragraphs();
  if(!ps.length){status('먼저 대본을 붙여넣으세요.','bad');return}
  const picks=[ps[0],ps[Math.floor(ps.length*.34)],ps[Math.floor(ps.length*.68)],ps[ps.length-1]].map(cleanText);
  const hooks=['그날, 모든 게 이상해졌습니다.','가족들은 이미 알고 있었습니다.','단서 하나가 모든 걸 바꿨습니다.','그녀는 끝내 선택했습니다.'];
  let out='';
  picks.forEach((p,i)=>{
    out+=`📸 ${i+1}컷 (${i*6}~${(i+1)*6}초)\n화면 설명: ${p.slice(0,100)}\n화면 문구: "${hooks[i]}"\n나레이션: ${p.slice(0,78)}\n이미지 규칙: 9:16, 말풍선 없음, 강렬한 짧은 문구, 동일 여주 얼굴 유지\n\n`;
  });
  $('shortsOutput').value=out.trim();switchTab('shorts');
  status('쇼츠 4컷 초안을 만들었습니다. 필요한 문구만 수정하세요.','ok');
}

  const v=settings();
  $('youtubeOutput').value=`📌 제목

끝까지 시청하시고 여러분의 생각도 댓글로 남겨주세요.

📌 해시태그
#사연 #인생이야기 #가족갈등 #반전사연 #감동사연 #중년이야기 #썰쟁

📌 고정 댓글
여러분이라면 같은 상황에서 어떤 선택을 하셨을까요?`;
  switchTab('youtube');status('유튜브 업로드 정보를 만들었습니다.','ok');
}
function makeJapanesePrompt(){
  const story=$('storyOutput').value.trim();
  if(!story){status('먼저 대본을 붙여넣으세요.','bad');return}
  $('japaneseOutput').value=`아래 한국어 사연을 일본 중장년층이 자연스럽게 들을 수 있는 일본어 유튜브 대본으로 번역·현지화해줘.

규칙:
- 문단 번호와 사건 흐름 유지
- 일본인이 이해하기 어려운 한국식 시댁 표현은 자연스럽게 현지화
- 감정선과 반전은 유지
- 대화체는 최소화
- 문단당 약 450자 안팎
- 완성 일본어 원고만 출력

[한국어 원고]
${story}`;
  switchTab('japanese');status('일본어판 ChatGPT 요청문을 만들었습니다.','ok');
}
function makeCaptions(){
  const ps=paragraphs();
  if(!ps.length){status('먼저 대본을 붙여넣으세요.','bad');return}
  let sec=0,out=[];
  ps.forEach(p=>{
    const clean=cleanText(p);if(!clean)return;
    const dur=Math.max(5,Math.ceil(clean.length/7));
    out.push(`${out.length+1}\n${time(sec)} --> ${time(sec+dur)}\n${clean}\n`);
    sec+=dur;
  });
  $('captionsOutput').value=out.join('\n');switchTab('captions');
  status('SRT 자막을 만들었습니다.','ok');
}
function time(s){
  return`${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')},000`;
}

function payload(){
  return{
    id:state.id||crypto.randomUUID(),updatedAt:new Date().toISOString(),
    settings:settings(),story:$('storyOutput').value,shorts:$('shortsOutput').value,
    youtube:$('youtubeOutput').value,japanese:$('japaneseOutput').value,
    captions:$('captionsOutput').value,scenes:state.scenes,thumbnails:state.thumbnails
  }
}
function saveProject(){
  const p=payload();state.id=p.id;
  localStorage.setItem('v4:'+p.id,JSON.stringify(p));
  let ids=JSON.parse(localStorage.getItem('v4:index')||'[]');
  ids=[p.id,...ids.filter(x=>x!==p.id)];
  localStorage.setItem('v4:index',JSON.stringify(ids));
  status('이 브라우저에 프로젝트를 저장했습니다.','ok');
}
function openProjects(){
  const ids=JSON.parse(localStorage.getItem('v4:index')||'[]'),list=$('projectList');
  list.innerHTML='';
  ids.forEach(id=>{
    try{
      const p=JSON.parse(localStorage.getItem('v4:'+id));
      const d=document.createElement('div');d.className='projectItem';
      d.innerHTML=`<div><b>${esc(p.settings.projectName)}</b><br><span class="small">${new Date(p.updatedAt).toLocaleString()}</span></div>
      <div><button class="btn ghost" onclick="loadProject('${id}')">열기</button>
      <button class="btn danger" onclick="deleteProject('${id}')">삭제</button></div>`;
      list.appendChild(d);
    }catch{}
  });
  if(!ids.length)list.textContent='저장된 프로젝트가 없습니다.';
  $('projectsModal').classList.remove('hidden');
}
function loadProject(id){
  const p=JSON.parse(localStorage.getItem('v4:'+id));state.id=p.id;
  for(const k of ['projectName','topic','heroine','paragraphs','imageCount','pov','tone'])$(k).value=p.settings[k];
  for(const k of ['subscribe','noBubbles','longPerm'])$(k).checked=p.settings[k];
  $('storyOutput').value=p.story||'';$('shortsOutput').value=p.shorts||'';
  $('youtubeOutput').value=p.youtube||'';$('japaneseOutput').value=p.japanese||'';
  $('captionsOutput').value=p.captions||'';state.scenes=p.scenes||[];state.thumbnails=p.thumbnails||[];
  renderScenes();renderThumbnails();closeModal('projectsModal');switchTab('story');
  status('프로젝트를 불러왔습니다.','ok');
}
function deleteProject(id){
  localStorage.removeItem('v4:'+id);
  let ids=JSON.parse(localStorage.getItem('v4:index')||'[]').filter(x=>x!==id);
  localStorage.setItem('v4:index',JSON.stringify(ids));openProjects();
}

async function copyCurrent(){
  let t='';
  if(state.active==='images')t=state.scenes.map((s,i)=>`${i+1}. ${s.title}\n${s.prompt}`).join('\n\n');
  else if(state.active==='thumbnail')t=state.thumbnails.map((s,i)=>`${s.title}\n문구: ${s.copy}\n${s.prompt}`).join('\n\n');
  else t=$(state.active+'Output').value;
  await navigator.clipboard.writeText(t);status('현재 내용을 복사했습니다.','ok');
}
async function downloadZip(){
  if(!$('storyOutput').value.trim()){status('먼저 대본을 붙여넣으세요.','bad');return}
  const z=new JSZip(),base=z.folder('sseoljeng-project');
  base.file('01_롱폼.txt',$('storyOutput').value);
  base.file('02_쇼츠4컷.txt',$('shortsOutput').value);
  base.file('03_유튜브정보.txt',$('youtubeOutput').value);
  base.file('04_일본어요청문.txt',$('japaneseOutput').value);
  base.file('05_자막.srt',$('captionsOutput').value);
  base.file('06_본문이미지프롬프트.txt',state.scenes.map((s,i)=>`${i+1}. ${s.title}\n${s.prompt}`).join('\n\n'));
  base.file('07_썸네일프롬프트.txt',state.thumbnails.map(s=>`${s.title}\n문구: ${s.copy}\n${s.prompt}`).join('\n\n'));
  const images=base.folder('images');
  state.scenes.forEach((s,i)=>{
    if(s.image){
      const m=s.image.match(/^data:image\/(\w+);base64,(.+)$/);
      if(m)images.file(`${String(i+1).padStart(2,'0')}_본문.${m[1]==='jpeg'?'jpg':m[1]}`,m[2],{base64:true});
    }
  });
  const thumbs=base.folder('thumbnails');
  state.thumbnails.forEach((s,i)=>{
    if(s.image){
      const m=s.image.match(/^data:image\/(\w+);base64,(.+)$/);
      if(m)thumbs.file(`썸네일_${String.fromCharCode(65+i)}.${m[1]==='jpeg'?'jpg':m[1]}`,m[2],{base64:true});
    }
  });
  base.file('README.txt','1. images 폴더 사진을 번호순으로 캡컷에 불러옵니다.\n2. 01_롱폼.txt를 음성 제작에 사용합니다.\n3. PC/웹 캡컷은 05_자막.srt를 가져올 수 있습니다.\n4. 모바일은 음성 삽입 후 자동 자막을 사용하세요.\n5. thumbnails 폴더에서 최종 썸네일을 선택하세요.');
  const blob=await z.generateAsync({type:'blob'}),a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=`${settings().projectName||'썰쟁'}_${new Date().toISOString().slice(0,10)}.zip`;
  a.click();URL.revokeObjectURL(a.href);status('캡컷용 ZIP 저장 완료','ok');
}
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
updateMeta();
</script>
