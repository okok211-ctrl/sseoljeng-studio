<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>썰쟁 Studio v5.1 AI</title>
<meta name="description" content="Gemini API를 이용한 썰쟁 전용 AI 사연 제작 스튜디오">
<style>
:root{
 --bg:#050b14;--panel:#0d1828;--panel2:#111f33;--line:#273b57;--text:#f8fafc;
 --muted:#9fb0c5;--accent:#ff7917;--accent2:#ffab61;--ok:#26c87a;--danger:#ff6672
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--text);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;
background:radial-gradient(circle at 95% 0,rgba(255,121,23,.2),transparent 30%),linear-gradient(145deg,#02070e,#071322 55%,#0d1728)}
button,input,textarea,select{font:inherit}
.app{max-width:1580px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;
padding:18px 20px;border:1px solid rgba(255,255,255,.08);border-radius:20px;background:rgba(13,24,40,.95)}
h1{margin:0;font-size:clamp(25px,4vw,40px);letter-spacing:-.05em}.sub{color:var(--muted);font-size:13px;margin-top:4px}
.badge{padding:8px 11px;border-radius:999px;background:rgba(38,200,122,.13);border:1px solid rgba(38,200,122,.4);font-size:11px;font-weight:900;color:#baffd8}
.layout{display:grid;grid-template-columns:365px 1fr;gap:16px;margin-top:16px}.panel{border-radius:19px;background:rgba(13,24,40,.96);border:1px solid rgba(255,255,255,.08)}
.side{padding:17px;position:sticky;top:15px;height:max-content}.main{padding:17px;min-width:0}h2{font-size:17px;margin:0 0 12px}
.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:900;color:#d0dbe8;margin-bottom:6px}
input,textarea,select{width:100%;background:#06101d;color:white;border:1px solid var(--line);border-radius:10px;padding:10px 11px;outline:none}
textarea{resize:vertical;line-height:1.6}.field textarea{min-height:75px}input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,121,23,.12)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:11px;padding:10px 12px;font-weight:900;cursor:pointer;transition:.16s}
.btn:hover{transform:translateY(-1px)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.secondary{background:#243751;color:#eef5ff}.ghost{background:#0b1524;color:#dbe7f5;border:1px solid var(--line)}.success{background:var(--ok);color:#052316}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.wide{grid-column:1/-1}
.status{margin-top:11px;padding:10px;border-radius:10px;border:1px dashed var(--line);background:#07111f;color:var(--muted);font-size:12px;line-height:1.5}
.status.ok{border-color:#2d7851;color:#baffd5}.status.bad{border-color:#7e3640;color:#ffc2c7}
.progress{height:8px;background:#07111f;border-radius:999px;overflow:hidden;margin:10px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--ok));transition:.3s}
.note{font-size:11px;color:#ffd7b8;background:rgba(255,121,23,.08);border:1px solid rgba(255,121,23,.24);border-radius:10px;padding:10px;line-height:1.55;margin-top:11px}
.tabs{display:flex;gap:7px;overflow:auto;padding-bottom:5px;margin-bottom:12px}.tab{white-space:nowrap;border:1px solid var(--line);background:#18283e;color:#b8c7da;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:900;cursor:pointer}
.tab.active{background:rgba(255,121,23,.17);color:#ffd7b8;border-color:rgba(255,121,23,.55)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.meta{font-size:12px;color:var(--muted)}.output{width:100%;min-height:650px;padding:17px;border-radius:14px;background:#040b14;border:1px solid #20344f;color:#fff;line-height:1.75;font-size:14px}
.hidden{display:none!important}.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}.checks{display:grid;gap:6px;margin:10px 0}.check{display:flex;gap:7px;color:#c6d2df;font-size:12px;line-height:1.45}.check input{width:auto}
@media(max-width:920px){.layout{grid-template-columns:1fr}.side{position:static}.top{align-items:flex-start;flex-direction:column}.output{min-height:480px}}
</style>
</head>
<body>
<div class="app">
<header class="top">
 <div><h1>🎬 썰쟁 Studio v5.1 AI</h1><div class="sub">Gemini 자동 생성 · API 키는 Vercel에 안전하게 보관</div></div>
 <span class="badge">AI 자동 생성</span>
</header>
<div class="layout">
<aside class="panel side">
 <h2>이야기 설정</h2>
 <div class="field"><label>프로젝트 이름</label><input id="name" value="새로운 사연"></div>
 <div class="field"><label>주제</label><textarea id="topic">길에서 굶어 죽어가던 노인을 도와줬는데 나중에 알고 보니 엄청난 갑부였습니다.</textarea></div>
 <div class="field"><label>여자 주인공</label><textarea id="heroine">37세 한국인 여성, 자연스러운 롱펌, 차분하고 강단 있는 인상, 동일 인물 유지</textarea></div>
 <div class="row">
  <div class="field"><label>문단 수</label><select id="count"><option>15</option><option selected>20</option></select></div>
  <div class="field"><label>이미지 수</label><select id="images"><option>3</option><option selected>4</option><option>5</option></select></div>
 </div>
 <div class="row">
  <div class="field"><label>시점</label><select id="pov"><option>3인칭 관찰자</option><option>1인칭 회고체</option></select></div>
  <div class="field"><label>분위기</label><select id="tone"><option>긴장감과 반전</option><option>감동</option><option>통쾌함</option><option>가족 갈등</option></select></div>
 </div>
 <div class="checks">
  <label class="check"><input id="subscribe" type="checkbox" checked>0문단 구독·좋아요·알림 멘트</label>
  <label class="check"><input id="strict" type="checkbox" checked>문단당 420~450자 최대한 준수</label>
 </div>
 <div class="actions">
  <button id="allBtn" class="btn primary wide" onclick="generateAll()">✨ 전체 자동 생성</button>
  <button class="btn secondary" onclick="generate('story')">롱폼</button>
  <button class="btn secondary" onclick="generate('assets')">제작 자료</button>
  <button class="btn secondary" onclick="generate('japanese')">일본어판</button>
  <button class="btn secondary" onclick="makeSrt()">SRT 자막</button>
  <button class="btn success wide" onclick="downloadZip()">📦 캡컷용 ZIP 저장</button>
  <button class="btn ghost" onclick="saveLocal()">저장</button>
  <button class="btn ghost" onclick="loadLocal()">불러오기</button>
 </div>
 <div class="progress"><div id="bar" class="bar"></div></div>
 <div id="status" class="status">주제를 입력하고 전체 자동 생성을 누르세요.</div>
 <div class="note">무료 사용량은 Google 계정·모델·지역·현재 정책에 따라 달라질 수 있습니다. 한도를 넘으면 자동으로 결제되는 구조가 아니라 API 오류가 날 수 있으며, 유료 결제를 직접 활성화하지 않았다면 요금은 청구되지 않습니다.</div>
</aside>

<section class="panel main">
 <nav class="tabs">
  <button class="tab active" data-tab="story">롱폼</button>
  <button class="tab" data-tab="images">이미지 프롬프트</button>
  <button class="tab" data-tab="shorts">쇼츠 4컷</button>
  <button class="tab" data-tab="youtube">유튜브 정보</button>
  <button class="tab" data-tab="thumbnail">썸네일</button>
  <button class="tab" data-tab="japanese">일본어</button>
  <button class="tab" data-tab="srt">SRT</button>
 </nav>
 <div class="toolbar"><span id="meta" class="meta">0자</span><button class="btn ghost" onclick="copyCurrent()">현재 내용 복사</button></div>
 <textarea id="story" class="output"></textarea>
 <textarea id="imagesOut" class="output hidden"></textarea>
 <textarea id="shorts" class="output hidden"></textarea>
 <textarea id="youtube" class="output hidden"></textarea>
 <textarea id="thumbnail" class="output hidden"></textarea>
 <textarea id="japanese" class="output hidden"></textarea>
 <textarea id="srt" class="output hidden"></textarea>
</section>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $=id=>document.getElementById(id);
let active='story',busy=false;
const fields={story:'story',images:'imagesOut',shorts:'shorts',youtube:'youtube',thumbnail:'thumbnail',japanese:'japanese',srt:'srt'};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));
Object.values(fields).forEach(id=>$(id).addEventListener('input',meta));

function switchTab(t){
 active=t;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));
 Object.entries(fields).forEach(([k,id])=>$(id).classList.toggle('hidden',k!==t));meta();
}
function cfg(){return{name:$('name').value.trim(),topic:$('topic').value.trim(),heroine:$('heroine').value.trim(),count:+$('count').value,images:+$('images').value,pov:$('pov').value,tone:$('tone').value,subscribe:$('subscribe').checked,strict:$('strict').checked}}
function setStatus(t,type=''){ $('status').innerHTML=t;$('status').className='status '+type}
function setProgress(n){$('bar').style.width=n+'%'}
function meta(){const v=$(fields[active]).value;$('meta').textContent=`${v.length.toLocaleString()}자 · ${active}`}
function setBusy(v,label='AI 생성 중...'){busy=v;$('allBtn').disabled=v;if(v)setStatus(`<span class="spinner"></span>${label}`)}
async function callAI(task,prompt){
 const r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({task,prompt})});
 const data=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(data.error||`서버 오류 ${r.status}`);
 window.lastGeminiModel=data.model||''; return data.text||'';
}
function storyPrompt(){
 const v=cfg();
 return `유튜브 사연 채널 '썰쟁'용 완성 원고를 작성하세요.

주제: ${v.topic}
주인공: ${v.heroine}
시점: ${v.pov}
분위기: ${v.tone}
구성: 0문단 오프닝 + 본문 ${v.count}문단
${v.strict?'각 문단은 공백 포함 약 420~450자를 최대한 정확히 맞추세요.':'각 문단은 약 420~450자로 작성하세요.'}

필수 규칙:
1. 가장 충격적인 사건을 먼저 보여주는 강한 후킹으로 시작합니다.
2. 0문단에는 사건 예고와 "${v.subscribe?'시청 전 구독과 좋아요, 알림은 큰 힘이 됩니다.':'자연스러운 도입 멘트'}"를 포함합니다.
3. 대화체는 꼭 필요한 부분만 짧게 사용합니다.
4. '~다/~습니다' 종결은 전체 약 10% 이하로 제한하고 '~했어요, ~였지요, ~더군요, ~였으니까요' 등을 자연스럽게 섞습니다.
5. 중장년층이 듣기 편하게 사건과 감정을 선명하게 설명합니다.
6. 억지스러운 우연을 남발하지 말고 복선과 반전을 논리적으로 연결합니다.
7. 동일 인물의 나이, 관계, 성격, 시간 흐름을 끝까지 유지합니다.
8. 과도한 폭력·선정적 표현은 피합니다.
9. 각 문단은 반드시 '0문단', '1문단'처럼 제목을 붙입니다.
10. 각 문단 끝에 [문단 글자 수: N자]를 붙입니다.
11. 설명이나 인사 없이 완성 원고만 출력합니다.`;
}
function assetsPrompt(story){
 const v=cfg();
 return `아래 완성된 유튜브 사연을 분석해 제작 자료를 만드세요.

[설정]
주제: ${v.topic}
동일 여자 주인공: ${v.heroine}
본문 이미지 수: ${v.images}장

[원고]
${story}

다음 구분자를 정확히 지켜 출력하세요.

===IMAGES===
본문 전체 흐름을 균등하게 나눠 가장 중요한 장면 ${v.images}개를 선정합니다.
각 항목 형식:
[이미지 1]
사용 문단:
장면 설명:
생성 프롬프트: 한국 드라마 실사 영화 스틸, 16:9. 동일 여자 주인공의 얼굴·롱펌·연령·체형을 모든 장면에서 유지. 장면에 맞는 현실적인 한국 장소와 의상, 시네마틱 조명, 감정이 선명한 표정. 화면 글자·자막·말풍선·로고·워터마크 없음.

===SHORTS===
24초 내외 쇼츠 4컷.
각 컷에 시간, 화면 장면, 강렬한 화면 문구, 짧은 나레이션, 9:16 이미지 프롬프트를 작성합니다.
말풍선은 사용하지 않고 화면 문구는 짧게 작성합니다.
마지막은 '결말은 본편에서 계속됩니다.' 정도만 사용하며 채널 검색 유도 문구는 넣지 않습니다.

===YOUTUBE===
제목 3안, 설명, 해시태그, 고정 댓글을 작성합니다.
제목은 과장만 하지 말고 강한 궁금증을 유발합니다.

===THUMBNAIL===
16:9 썸네일 A/B/C 3안.
각 안에 15자 안팎의 강렬한 문구와 이미지 생성 프롬프트를 작성합니다.
인물 얼굴이 크고 감정이 명확해야 하며 글자가 얼굴을 가리지 않게 합니다.`;
}
function japanesePrompt(story){
 return `아래 한국어 유튜브 사연을 일본 중장년층이 자연스럽게 들을 수 있는 일본어 대본으로 번역하고 현지화하세요.

규칙:
- 원문의 문단 번호, 사건 순서, 반전, 감정선을 유지합니다.
- 한국식 가족 호칭과 문화는 일본인이 자연스럽게 이해하도록 바꿉니다.
- 지나친 직역을 피하고 일본 유튜브 낭독 사연처럼 자연스럽게 작성합니다.
- 대화체는 최소화합니다.
- 문단마다 원문과 비슷한 분량을 유지합니다.
- 문단 끝 글자 수 표시는 제거합니다.
- 설명 없이 완성 일본어 원고만 출력합니다.

[한국어 원고]
${story}`;
}
function parseAssets(text){
 const grab=(a,b)=>{const s=text.indexOf(a);if(s<0)return'';const e=b?text.indexOf(b,s+a.length):-1;return text.slice(s+a.length,e<0?undefined:e).trim()};
 $('imagesOut').value=grab('===IMAGES===','===SHORTS===');
 $('shorts').value=grab('===SHORTS===','===YOUTUBE===');
 $('youtube').value=grab('===YOUTUBE===','===THUMBNAIL===');
 $('thumbnail').value=grab('===THUMBNAIL===',null);
}
async function generate(type){
 if(busy)return;
 try{
  setBusy(true);setProgress(8);
  if(type==='story'){
   if(!cfg().topic)throw new Error('주제를 입력하세요.');
   $('story').value=await callAI('story',storyPrompt());switchTab('story');setProgress(100);setStatus(`롱폼 생성 완료 · ${window.lastGeminiModel||'Gemini 자동 선택'}`,'ok');
  }else if(type==='assets'){
   if(!$('story').value.trim())throw new Error('먼저 롱폼을 생성하세요.');
   const text=await callAI('assets',assetsPrompt($('story').value));parseAssets(text);switchTab('images');setProgress(100);setStatus(`제작 자료 생성 완료 · ${window.lastGeminiModel||'Gemini 자동 선택'}`,'ok');
  }else if(type==='japanese'){
   if(!$('story').value.trim())throw new Error('먼저 롱폼을 생성하세요.');
   $('japanese').value=await callAI('japanese',japanesePrompt($('story').value));switchTab('japanese');setProgress(100);setStatus(`일본어판 생성 완료 · ${window.lastGeminiModel||'Gemini 자동 선택'}`,'ok');
  }
  saveLocal();meta();
 }catch(e){setProgress(0);setStatus(e.message,'bad')}finally{setBusy(false)}
}
async function generateAll(){
 if(busy)return;
 try{
  setBusy(true,'1/3 롱폼을 생성하고 있습니다...');setProgress(5);
  if(!cfg().topic)throw new Error('주제를 입력하세요.');
  $('story').value=await callAI('story',storyPrompt());setProgress(38);
  setStatus('<span class="spinner"></span>2/3 이미지·쇼츠·업로드 자료를 생성하고 있습니다...');
  const assets=await callAI('assets',assetsPrompt($('story').value));parseAssets(assets);setProgress(72);
  setStatus('<span class="spinner"></span>3/3 일본어판을 생성하고 있습니다...');
  $('japanese').value=await callAI('japanese',japanesePrompt($('story').value));setProgress(92);
  makeSrt(false);setProgress(100);saveLocal();switchTab('story');setStatus(`전체 자동 생성 완료 · 마지막 사용 모델: ${window.lastGeminiModel||'Gemini 자동 선택'}`,'ok');
 }catch(e){setProgress(0);setStatus(e.message,'bad')}finally{setBusy(false);meta()}
}
function splitParagraphs(){
 const raw=$('story').value.trim();if(!raw)return[];
 const m=[...raw.matchAll(/(?:^|\n)(?:\*\*)?(\d+문단)(?:\*\*)?\s*\n([\s\S]*?)(?=\n(?:\*\*)?\d+문단(?:\*\*)?|\s*$)/g)];
 return (m.length?m.map(x=>x[2]):raw.split(/\n{2,}/)).map(x=>x.replace(/\[문단 글자 수:[^\]]+\]/g,'').trim()).filter(Boolean)
}
function time(s){return`${String(Math.floor(s/3600)).padStart(2,'0')}:${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')},000`}
function makeSrt(show=true){
 const p=splitParagraphs();if(!p.length){if(show)setStatus('먼저 롱폼을 생성하세요.','bad');return}
 let sec=0,out=[];p.forEach(x=>{const dur=Math.max(5,Math.ceil(x.length/7));out.push(`${out.length+1}\n${time(sec)} --> ${time(sec+dur)}\n${x}\n`);sec+=dur});
 $('srt').value=out.join('\n');if(show){switchTab('srt');setStatus('SRT 자막 생성 완료','ok')}meta()
}
function project(){return{config:cfg(),story:$('story').value,images:$('imagesOut').value,shorts:$('shorts').value,youtube:$('youtube').value,thumbnail:$('thumbnail').value,japanese:$('japanese').value,srt:$('srt').value}}
function saveLocal(){localStorage.setItem('sseoljeng-v5',JSON.stringify(project()));if(!busy)setStatus('브라우저에 저장했습니다.','ok')}
function loadLocal(){
 const p=JSON.parse(localStorage.getItem('sseoljeng-v5')||'null');if(!p){setStatus('저장된 프로젝트가 없습니다.','bad');return}
 for(const k of ['name','topic','heroine','count','images','pov','tone'])if(p.config[k]!==undefined)$(k).value=p.config[k];
 for(const k of ['subscribe','strict'])$(k).checked=!!p.config[k];
 $('story').value=p.story||'';$('imagesOut').value=p.images||'';$('shorts').value=p.shorts||'';$('youtube').value=p.youtube||'';$('thumbnail').value=p.thumbnail||'';$('japanese').value=p.japanese||'';$('srt').value=p.srt||'';
 setStatus('저장된 프로젝트를 불러왔습니다.','ok');meta()
}
async function copyCurrent(){await navigator.clipboard.writeText($(fields[active]).value);setStatus('현재 내용을 복사했습니다.','ok')}
async function downloadZip(){
 if(!$('story').value.trim()){setStatus('먼저 롱폼을 생성하세요.','bad');return}
 const z=new JSZip(),f=z.folder('sseoljeng-project');
 f.file('01_롱폼.txt',$('story').value);f.file('02_본문이미지프롬프트.txt',$('imagesOut').value);f.file('03_쇼츠4컷.txt',$('shorts').value);
 f.file('04_유튜브정보.txt',$('youtube').value);f.file('05_썸네일.txt',$('thumbnail').value);f.file('06_일본어판.txt',$('japanese').value);f.file('07_자막.srt',$('srt').value);
 f.file('README.txt','이미지는 02_본문이미지프롬프트.txt의 프롬프트를 ChatGPT 이미지 생성에 사용하세요.\nPC/웹 캡컷에서는 07_자막.srt를 불러올 수 있습니다.\n모바일 캡컷에서는 음성 삽입 후 자동 자막을 사용하는 것이 편합니다.');
 const blob=await z.generateAsync({type:'blob'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`${cfg().name||'썰쟁'}_${new Date().toISOString().slice(0,10)}.zip`;a.click();URL.revokeObjectURL(a.href);
 setStatus('캡컷용 ZIP 저장 완료','ok')
}
meta();
</script>
